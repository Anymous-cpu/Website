<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Store - Sky Island</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 100px;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #1a2980;
            margin-bottom: 8px;
            font-size: 22px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .login-form {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
            text-decoration: none;
            text-align: center;
            color: white;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-store {
            background: linear-gradient(135deg, #1a2980, #26d0ce);
        }

        .btn-chat {
            background: linear-gradient(135deg, #00b09b, #96c93d);
        }

        .user-info {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 12px;
        }

        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 12px;
            transition: transform 0.3s;
        }

        .logout-btn:active {
            transform: scale(0.95);
        }

        .bottom-nav {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            border-radius: 50px;
            padding: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 90;
            max-width: 95%;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            margin: 0 4px;
            position: relative;
        }

        .nav-item i {
            font-size: 18px;
            margin-bottom: 3px;
        }

        .nav-item span {
            font-size: 9px;
            font-weight: 600;
        }

        .nav-item.active {
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(26, 41, 128, 0.4);
        }

        .nav-item:active {
            transform: scale(0.95);
        }

        /* Mobile optimizations */
        @media (max-width: 480px) {
            body {
                padding: 12px;
                padding-bottom: 90px;
            }
            
            .container {
                padding: 15px;
                border-radius: 16px;
            }
            
            .header h1 {
                font-size: 20px;
            }
            
            .login-form {
                padding: 15px;
            }
            
            .btn-group {
                grid-template-columns: 1fr;
            }
            
            .nav-item {
                width: 50px;
                height: 50px;
            }
            
            .nav-item i {
                font-size: 16px;
            }
        }

        @media (max-width: 360px) {
            .nav-item {
                width: 45px;
                height: 45px;
                margin: 0 3px;
            }
            
            .nav-item i {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Sky Island Store</h1>
            <p>Kelola toko dan chat dengan pembeli</p>
        </div>

        <div id="loginSection">
            <div class="login-form">
                <h3 style="margin-bottom: 15px; text-align: center; color: #1a2980;">Masuk ke Akun Anda</h3>
                <div class="form-group">
                    <label for="username">Nama Pengguna</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button class="btn btn-store" onclick="login()" style="width: 100%;">Masuk</button>
            </div>
        </div>

        <div id="storeSection" style="display: none;">
            <div class="user-info">
                <h3 style="margin-bottom: 8px; color: #1a2980;">Halo, <span id="currentUser"></span>!</h3>
                <p style="color: #666; font-size: 12px; margin-bottom: 8px;">Selamat datang di toko Anda</p>
                <button class="logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Keluar
                </button>
            </div>

            <div class="btn-group">
                <a href="your-store.html" class="btn btn-store">
                    <i class="fas fa-store"></i><br>
                    <span style="font-size: 12px;">Your Store</span>
                </a>
                <a href="chat-list.html" class="btn btn-chat">
                    <i class="fas fa-comments"></i><br>
                    <span style="font-size: 12px;">Chat</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="credit.html" class="nav-item">
            <i class="fas fa-coins"></i>
            <span>Credit</span>
        </a>
        <a href="pencarian.html" class="nav-item">
            <i class="fas fa-search"></i>
            <span>Pencarian</span>
        </a>
        <a href="home.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="store.html" class="nav-item active">
            <i class="fas fa-store"></i>
            <span>Store</span>
        </a>
        <a href="akun.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Akun</span>
        </a>
    </div>

    <script>
        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const existingUsers = JSON.parse(localStorage.getItem('skyIslandUsers') || '[]');
            const user = existingUsers.find(user => user.username === username && user.password === password);

            if (user) {
                localStorage.setItem('skyIslandCurrentUser', username);
                showStoreSection();
            } else {
                alert('Username atau password salah!');
            }
        }

        function logout() {
            localStorage.removeItem('skyIslandCurrentUser');
            showLoginSection();
        }

        function showStoreSection() {
            const currentUser = localStorage.getItem('skyIslandCurrentUser');
            if (currentUser) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('storeSection').style.display = 'block';
                document.getElementById('currentUser').textContent = currentUser;
            }
        }

        function showLoginSection() {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('storeSection').style.display = 'none';
        }

        // Cek status login saat halaman dimuat
        document.addEventListener('DOMContentLoaded', function() {
            const currentUser = localStorage.getItem('skyIslandCurrentUser');
            if (currentUser) {
                showStoreSection();
            } else {
                showLoginSection();
            }
        });

        // Bottom navigation active state
        const navItems = document.querySelectorAll('.nav-item');
        
        navItems.forEach(item => {
            item.addEventListener('click', function() {
                navItems.forEach(nav => nav.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Enter key untuk login
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
