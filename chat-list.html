<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat - Sky Island</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 100px;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        .header h1 {
            color: #1a2980;
            font-size: 22px;
        }

        .back-btn {
            background: #6c757d;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.3s;
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        .chat-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.3s;
        }

        .chat-item:active {
            background: #f8f9fa;
        }

        .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #1a2980;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
            font-size: 18px;
        }

        .chat-info {
            flex: 1;
        }

        .chat-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
            font-size: 16px;
        }

        .chat-last-message {
            color: #666;
            font-size: 13px;
        }

        .chat-time {
            color: #999;
            font-size: 11px;
        }

        .no-chats {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .no-chats i {
            font-size: 48px;
            margin-bottom: 15px;
            color: #ddd;
        }

        .bottom-nav {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            border-radius: 50px;
            padding: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 90;
            max-width: 95%;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            margin: 0 4px;
            position: relative;
        }

        .nav-item i {
            font-size: 18px;
            margin-bottom: 3px;
        }

        .nav-item span {
            font-size: 9px;
            font-weight: 600;
        }

        .nav-item.active {
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(26, 41, 128, 0.4);
        }

        .nav-item:active {
            transform: scale(0.95);
        }

        /* Mobile optimizations */
        @media (max-width: 480px) {
            body {
                padding: 12px;
                padding-bottom: 90px;
            }
            
            .container {
                padding: 15px;
                border-radius: 16px;
            }
            
            .header h1 {
                font-size: 20px;
            }
            
            .chat-item {
                padding: 12px;
            }
            
            .chat-avatar {
                width: 45px;
                height: 45px;
                font-size: 16px;
            }
            
            .nav-item {
                width: 50px;
                height: 50px;
            }
            
            .nav-item i {
                font-size: 16px;
            }
        }

        @media (max-width: 360px) {
            .nav-item {
                width: 45px;
                height: 45px;
                margin: 0 3px;
            }
            
            .nav-item i {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Percakapan</h1>
            <a href="store.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> Kembali
            </a>
        </div>

        <div class="chat-list" id="chatList">
            <!-- Daftar chat akan ditampilkan di sini -->
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="credit.html" class="nav-item">
            <i class="fas fa-coins"></i>
            <span>Credit</span>
        </a>
        <a href="pencarian.html" class="nav-item">
            <i class="fas fa-search"></i>
            <span>Pencarian</span>
        </a>
        <a href="home.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="store.html" class="nav-item active">
            <i class="fas fa-store"></i>
            <span>Store</span>
        </a>
        <a href="akun.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Akun</span>
        </a>
    </div>

    <script>
        function loadChats() {
            const currentUser = localStorage.getItem('skyIslandCurrentUser');
            const allChats = JSON.parse(localStorage.getItem('skyIslandChats') || '[]');
            
            // Filter chat yang melibatkan user saat ini (sebagai penjual)
            const userChats = allChats.filter(chat => 
                chat.seller === currentUser || chat.buyer === currentUser
            );

            const chatList = document.getElementById('chatList');
            chatList.innerHTML = '';

            if (userChats.length === 0) {
                chatList.innerHTML = `
                    <div class="no-chats">
                        <i class="fas fa-comments"></i>
                        <p>Belum ada percakapan</p>
                        <p style="font-size: 12px; margin-top: 8px;">Mulai chat dari halaman pencarian</p>
                    </div>
                `;
                return;
            }

            userChats.forEach(chat => {
                const otherUser = chat.seller === currentUser ? chat.buyer : chat.seller;
                const lastMessage = chat.messages[chat.messages.length - 1];
                
                const chatElement = document.createElement('div');
                chatElement.className = 'chat-item';
                chatElement.onclick = () => openChat(chat.id);
                
                chatElement.innerHTML = `
                    <div class="chat-avatar">${otherUser.charAt(0).toUpperCase()}</div>
                    <div class="chat-info">
                        <div class="chat-name">${otherUser}</div>
                        <div class="chat-last-message">${lastMessage.text ? (lastMessage.text.length > 30 ? lastMessage.text.substring(0, 30) + '...' : lastMessage.text) : '[Gambar]'}</div>
                    </div>
                    <div class="chat-time">${formatTime(lastMessage.timestamp)}</div>
                `;
                
                chatList.appendChild(chatElement);
            });
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 86400000) { // Kurang dari 1 hari
                return date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            } else {
                return date.toLocaleDateString('id-ID');
            }
        }

        function openChat(chatId) {
            window.location.href = `chat.html?id=${chatId}`;
        }

        document.addEventListener('DOMContentLoaded', function() {
            const currentUser = localStorage.getItem('skyIslandCurrentUser');
            if (!currentUser) {
                window.location.href = 'store.html';
                return;
            }
            loadChats();
        });

        // Bottom navigation active state
        const navItems = document.querySelectorAll('.nav-item');
        
        navItems.forEach(item => {
            item.addEventListener('click', function() {
                navItems.forEach(nav => nav.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
