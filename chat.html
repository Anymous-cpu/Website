<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat - Sky Island</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 100px;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            height: 75vh;
        }

        .chat-header {
            padding: 16px;
            border-bottom: 2px solid #eee;
            display: flex;
            align-items: center;
            gap: 12px;
            background: white;
            border-radius: 20px 20px 0 0;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #1a2980;
            padding: 8px;
            transition: transform 0.3s;
        }

        .back-btn:active {
            transform: scale(0.9);
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #1a2980;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            position: relative;
            overflow: hidden;
        }

        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .chat-with {
            flex: 1;
        }

        .chat-name {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        .chat-status {
            color: #666;
            font-size: 12px;
        }

        .rate-btn {
            background: #FFD700;
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: transform 0.3s;
        }

        .rate-btn:active {
            transform: scale(0.95);
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 75%;
            padding: 10px 12px;
            border-radius: 15px;
            position: relative;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.sent {
            align-self: flex-end;
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            color: white;
        }

        .message.received {
            align-self: flex-start;
            background: #f1f1f1;
            color: #333;
        }

        .message-time {
            font-size: 10px;
            margin-top: 4px;
            opacity: 0.7;
            text-align: right;
        }

        .message-image {
            max-width: 200px;
            border-radius: 10px;
            margin-bottom: 5px;
        }

        .message-video {
            max-width: 200px;
            border-radius: 10px;
            margin-bottom: 5px;
        }

        .chat-input {
            padding: 12px;
            border-top: 2px solid #eee;
            display: flex;
            gap: 8px;
            align-items: center;
            background: white;
            border-radius: 0 0 20px 20px;
        }

        .file-input {
            display: none;
        }

        .file-btn {
            background: none;
            border: none;
            font-size: 18px;
            color: #1a2980;
            cursor: pointer;
            padding: 8px;
            transition: transform 0.3s;
        }

        .file-btn:active {
            transform: scale(0.9);
        }

        .message-input {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
        }

        .send-btn {
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s;
        }

        .send-btn:active {
            transform: scale(0.9);
        }

        .rating-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .rating-content {
            background: white;
            border-radius: 15px;
            padding: 20px;
            max-width: 300px;
            width: 100%;
            text-align: center;
        }

        .rating-stars {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 15px 0;
        }

        .rating-star {
            font-size: 24px;
            color: #ddd;
            cursor: pointer;
            transition: color 0.3s;
        }

        .rating-star.active {
            color: #FFD700;
        }

        .rating-text {
            margin-bottom: 15px;
            color: #333;
            font-size: 14px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            border-radius: 50px;
            padding: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 90;
            max-width: 95%;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            margin: 0 4px;
            position: relative;
        }

        .nav-item i {
            font-size: 18px;
            margin-bottom: 3px;
        }

        .nav-item span {
            font-size: 9px;
            font-weight: 600;
        }

        .nav-item.active {
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(26, 41, 128, 0.4);
        }

        .nav-item:active {
            transform: scale(0.95);
        }

        /* Mobile optimizations */
        @media (max-width: 480px) {
            body {
                padding: 12px;
                padding-bottom: 90px;
            }
            
            .container {
                height: 70vh;
            }
            
            .chat-header {
                padding: 12px;
            }
            
            .chat-messages {
                padding: 12px;
            }
            
            .message {
                max-width: 85%;
                font-size: 13px;
            }
            
            .nav-item {
                width: 50px;
                height: 50px;
            }
            
            .nav-item i {
                font-size: 16px;
            }
        }

        @media (max-width: 360px) {
            .nav-item {
                width: 45px;
                height: 45px;
                margin: 0 3px;
            }
            
            .nav-item i {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="chat-header">
            <button class="back-btn" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="chat-avatar" id="chatAvatar">
                <i class="fas fa-user" id="chatAvatarIcon"></i>
                <img id="chatAvatarImage" src="" alt="Avatar" style="display: none;">
            </div>
            <div class="chat-with">
                <div class="chat-name" id="chatPartner"></div>
                <div class="chat-status">Online</div>
            </div>
            <button class="rate-btn" onclick="showRatingModal()">
                <i class="fas fa-star"></i> Rate
            </button>
        </div>

        <div class="chat-messages" id="chatMessages">
            <!-- Pesan akan ditampilkan di sini -->
        </div>

        <div class="chat-input">
            <input type="file" id="fileInput" class="file-input" accept="image/*,video/*">
            <button class="file-btn" onclick="document.getElementById('fileInput').click()">
                <i class="fas fa-paperclip"></i>
            </button>
            <input type="text" class="message-input" id="messageInput" placeholder="Ketik pesan..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <!-- Rating Modal -->
    <div class="rating-modal" id="ratingModal">
        <div class="rating-content">
            <h3 style="margin-bottom: 10px; color: #1a2980;">Beri Rating Produk</h3>
            <div class="rating-text">Bagaimana kualitas produk ini?</div>
            <div class="rating-stars">
                <i class="fas fa-star rating-star" data-rating="1"></i>
                <i class="fas fa-star rating-star" data-rating="2"></i>
                <i class="fas fa-star rating-star" data-rating="3"></i>
                <i class="fas fa-star rating-star" data-rating="4"></i>
                <i class="fas fa-star rating-star" data-rating="5"></i>
            </div>
            <textarea id="ratingComment" placeholder="Tulis ulasan Anda..." style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; font-size: 14px; resize: vertical; height: 60px;"></textarea>
            <button class="btn" onclick="submitRating()" style="width: 100%; padding: 10px; background: linear-gradient(135deg, #1a2980, #26d0ce); color: white; border: none; border-radius: 8px; cursor: pointer;">Kirim Rating</button>
            <button class="btn" onclick="hideRatingModal()" style="width: 100%; padding: 10px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 8px;">Batal</button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="credit.html" class="nav-item">
            <i class="fas fa-coins"></i>
            <span>Credit</span>
        </a>
        <a href="pencarian.html" class="nav-item">
            <i class="fas fa-search"></i>
            <span>Pencarian</span>
        </a>
        <a href="home.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="store.html" class="nav-item active">
            <i class="fas fa-store"></i>
            <span>Store</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Akun</span>
        </a>
    </div>

    <script>
        let currentChatId = null;
        let currentUser = null;
        let chatPartner = null;
        let currentProductId = null;
        let selectedRating = 0;

        function goBack() {
            window.location.href = 'chat-list.html';
        }

        function loadChat() {
            const urlParams = new URLSearchParams(window.location.search);
            currentChatId = parseInt(urlParams.get('id'));
            currentUser = localStorage.getItem('skyIslandCurrentUser');

            if (!currentChatId || !currentUser) {
                window.location.href = 'chat-list.html';
                return;
            }

            const allChats = JSON.parse(localStorage.getItem('skyIslandChats') || '[]');
            const chat = allChats.find(c => c.id === currentChatId);

            if (!chat) {
                window.location.href = 'chat-list.html';
                return;
            }

            chatPartner = chat.seller === currentUser ? chat.buyer : chat.seller;
            currentProductId = chat.productId;
            document.getElementById('chatPartner').textContent = chatPartner;

            // Load foto profil partner
            const users = JSON.parse(localStorage.getItem('skyIslandUsers') || '[]');
            const partnerUser = users.find(user => user.username === chatPartner);
            
            const chatAvatar = document.getElementById('chatAvatar');
            if (partnerUser && partnerUser.profileImage) {
                document.getElementById('chatAvatarImage').src = partnerUser.profileImage;
                document.getElementById('chatAvatarImage').style.display = 'block';
                document.getElementById('chatAvatarIcon').style.display = 'none';
            } else {
                document.getElementById('chatAvatarIcon').style.display = 'flex';
                document.getElementById('chatAvatarImage').style.display = 'none';
                chatAvatar.textContent = chatPartner.charAt(0).toUpperCase();
            }

            displayMessages(chat.messages);
            setupRatingStars();
        }

        function displayMessages(messages) {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';

            messages.forEach(message => {
                const messageElement = document.createElement('div');
                messageElement.className = `message ${message.sender === currentUser ? 'sent' : 'received'}`;
                
                let content = '';
                if (message.type === 'image') {
                    content = `
                        <img src="${message.content}" class="message-image">
                        ${message.text ? `<div>${message.text}</div>` : ''}
                    `;
                } else if (message.type === 'video') {
                    content = `
                        <video src="${message.content}" class="message-video" controls></video>
                        ${message.text ? `<div>${message.text}</div>` : ''}
                    `;
                } else {
                    content = message.text;
                }

                messageElement.innerHTML = `
                    ${content}
                    <div class="message-time">${formatTime(message.timestamp)}</div>
                `;
                container.appendChild(messageElement);
            });

            container.scrollTop = container.scrollHeight;
        }

        function formatTime(timestamp) {
            return new Date(timestamp).toLocaleTimeString('id-ID', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            const fileInput = document.getElementById('fileInput');
            
            if (!text && !fileInput.files[0]) return;

            const allChats = JSON.parse(localStorage.getItem('skyIslandChats') || '[]');
            const chatIndex = allChats.findIndex(c => c.id === currentChatId);

            if (chatIndex === -1) return;

            const newMessage = {
                sender: currentUser,
                text: text,
                timestamp: new Date().toISOString(),
                type: 'text'
            };

            // Handle file upload
            if (fileInput.files[0]) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    newMessage.type = file.type.startsWith('image') ? 'image' : 'video';
                    newMessage.content = e.target.result;
                    
                    allChats[chatIndex].messages.push(newMessage);
                    localStorage.setItem('skyIslandChats', JSON.stringify(allChats));
                    
                    displayMessages(allChats[chatIndex].messages);
                    input.value = '';
                    fileInput.value = '';
                };
                
                reader.readAsDataURL(file);
            } else {
                allChats[chatIndex].messages.push(newMessage);
                localStorage.setItem('skyIslandChats', JSON.stringify(allChats));
                
                displayMessages(allChats[chatIndex].messages);
                input.value = '';
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        // Handle file input change
        document.getElementById('fileInput').addEventListener('change', function() {
            if (this.files[0]) {
                sendMessage();
            }
        });

        // Rating functionality
        function setupRatingStars() {
            const stars = document.querySelectorAll('.rating-star');
            stars.forEach(star => {
                star.addEventListener('click', function() {
                    const rating = parseInt(this.getAttribute('data-rating'));
                    selectedRating = rating;
                    
                    // Update stars appearance
                    stars.forEach(s => {
                        if (parseInt(s.getAttribute('data-rating')) <= rating) {
                            s.classList.add('active');
                        } else {
                            s.classList.remove('active');
                        }
                    });
                });
            });
        }

        function showRatingModal() {
            document.getElementById('ratingModal').style.display = 'flex';
        }

        function hideRatingModal() {
            document.getElementById('ratingModal').style.display = 'none';
            selectedRating = 0;
            document.getElementById('ratingComment').value = '';
            
            // Reset stars
            const stars = document.querySelectorAll('.rating-star');
            stars.forEach(star => star.classList.remove('active'));
        }

        function submitRating() {
            if (selectedRating === 0) {
                alert('Pilih rating terlebih dahulu!');
                return;
            }

            const comment = document.getElementById('ratingComment').value.trim();
            
            const rating = {
                id: Date.now(),
                productId: currentProductId,
                userId: currentUser,
                stars: selectedRating,
                comment: comment,
                timestamp: new Date().toISOString()
            };

            const allRatings = JSON.parse(localStorage.getItem('skyIslandRatings') || '[]');
            allRatings.push(rating);
            localStorage.setItem('skyIslandRatings', JSON.stringify(allRatings));

            alert('Terima kasih atas rating Anda!');
            hideRatingModal();
        }

        document.addEventListener('DOMContentLoaded', loadChat);

        // Bottom navigation active state
        const navItems = document.querySelectorAll('.nav-item');
        
        navItems.forEach(item => {
            item.addEventListener('click', function() {
                navItems.forEach(nav => nav.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
