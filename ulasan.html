<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ulasan - Sky Island</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 100px;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        .header h1 {
            color: #1a2980;
            font-size: 22px;
        }

        .back-btn {
            background: #6c757d;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.3s;
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        /* Reviews List */
        .reviews-list {
            margin-top: 20px;
        }

        .review-item {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 1px solid #eee;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .review-product {
            font-weight: 600;
            color: #1a2980;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .review-user {
            color: #666;
            font-size: 12px;
        }

        .review-rating {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .rating-stars {
            display: flex;
            gap: 2px;
        }

        .rating-star {
            color: #FFD700;
            font-size: 14px;
        }

        .review-content {
            color: #333;
            line-height: 1.4;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .review-date {
            color: #999;
            font-size: 11px;
            margin-bottom: 10px;
        }

        /* Reply Section */
        .reply-section {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }

        .reply-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 8px;
            resize: vertical;
            min-height: 60px;
        }

        .reply-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
            flex: 1;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-reply {
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            color: white;
        }

        .btn-cancel {
            background: #6c757d;
            color: white;
        }

        .existing-reply {
            background: #e3f2fd;
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
            border-left: 4px solid #1a2980;
        }

        .reply-text {
            color: #333;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .reply-date {
            color: #666;
            font-size: 11px;
        }

        .no-reviews {
            text-align: center;
            color: #666;
            padding: 40px 20px;
            font-size: 16px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            border-radius: 50px;
            padding: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 90;
            max-width: 95%;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            margin: 0 4px;
            position: relative;
        }

        .nav-item i {
            font-size: 18px;
            margin-bottom: 3px;
        }

        .nav-item span {
            font-size: 9px;
            font-weight: 600;
        }

        .nav-item.active {
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(26, 41, 128, 0.4);
        }

        .nav-item:active {
            transform: scale(0.95);
        }

        /* Mobile optimizations */
        @media (max-width: 480px) {
            body {
                padding: 12px;
                padding-bottom: 90px;
            }
            
            .container {
                padding: 15px;
                border-radius: 16px;
            }
            
            .header h1 {
                font-size: 20px;
            }
            
            .review-item {
                padding: 12px;
            }
            
            .nav-item {
                width: 50px;
                height: 50px;
            }
            
            .nav-item i {
                font-size: 16px;
            }
        }

        @media (max-width: 360px) {
            .nav-item {
                width: 45px;
                height: 45px;
                margin: 0 3px;
            }
            
            .nav-item i {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Ulasan Produk</h1>
            <a href="your-store.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> Kembali
            </a>
        </div>

        <div class="reviews-list" id="reviewsContainer">
            <!-- Ulasan akan ditampilkan di sini -->
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="credit.html" class="nav-item">
            <i class="fas fa-coins"></i>
            <span>Credit</span>
        </a>
        <a href="pencarian.html" class="nav-item">
            <i class="fas fa-search"></i>
            <span>Pencarian</span>
        </a>
        <a href="home.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="store.html" class="nav-item active">
            <i class="fas fa-store"></i>
            <span>Store</span>
        </a>
        <a href="akun.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Akun</span>
        </a>
    </div>

    <script>
        function loadReviews() {
            const currentUser = localStorage.getItem('skyIslandCurrentUser');
            const allRatings = JSON.parse(localStorage.getItem('skyIslandRatings') || '[]');
            const allProducts = JSON.parse(localStorage.getItem('skyIslandProducts') || '[]');
            
            // Filter ratings untuk produk yang dimiliki user saat ini
            const userProducts = allProducts.filter(product => product.seller === currentUser);
            const userProductIds = userProducts.map(product => product.id);
            const userReviews = allRatings.filter(rating => userProductIds.includes(rating.productId));

            const container = document.getElementById('reviewsContainer');
            container.innerHTML = '';

            if (userReviews.length === 0) {
                container.innerHTML = `
                    <div class="no-reviews">
                        <i class="fas fa-star" style="font-size: 48px; color: #ddd; margin-bottom: 15px;"></i>
                        <p>Belum ada ulasan untuk produk Anda</p>
                    </div>
                `;
                return;
            }

            // Sort reviews by date (newest first)
            userReviews.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            userReviews.forEach(review => {
                const product = allProducts.find(p => p.id === review.productId);
                if (!product) return;

                const reviewElement = document.createElement('div');
                reviewElement.className = 'review-item';
                reviewElement.innerHTML = `
                    <div class="review-header">
                        <div>
                            <div class="review-product">${product.name}</div>
                            <div class="review-user">Oleh: ${review.userId}</div>
                        </div>
                        <div class="review-rating">
                            <div class="rating-stars">
                                ${generateStars(review.stars)}
                            </div>
                            <div style="font-size: 12px; color: #666;">${review.stars}/5</div>
                        </div>
                    </div>
                    <div class="review-content">
                        ${review.comment || 'Tidak ada komentar'}
                    </div>
                    <div class="review-date">
                        ${formatDate(review.timestamp)}
                    </div>
                    ${review.reply ? `
                        <div class="existing-reply">
                            <div class="reply-text"><strong>Balasan Anda:</strong> ${review.reply}</div>
                            <div class="reply-date">${formatDate(review.replyDate)}</div>
                        </div>
                    ` : `
                        <button class="btn btn-reply" onclick="showReplyForm(${review.id})">
                            <i class="fas fa-reply"></i> Balas Ulasan
                        </button>
                        <div class="reply-section" id="replySection-${review.id}">
                            <textarea class="reply-input" id="replyInput-${review.id}" placeholder="Tulis balasan Anda..."></textarea>
                            <div class="reply-actions">
                                <button class="btn btn-cancel" onclick="hideReplyForm(${review.id})">Batal</button>
                                <button class="btn btn-reply" onclick="submitReply(${review.id})">Kirim Balasan</button>
                            </div>
                        </div>
                    `}
                `;
                container.appendChild(reviewElement);
            });
        }

        function generateStars(count) {
            const stars = [];
            for (let i = 0; i < 5; i++) {
                if (i < count) {
                    stars.push('<i class="fas fa-star rating-star"></i>');
                } else {
                    stars.push('<i class="far fa-star rating-star"></i>');
                }
            }
            return stars.join('');
        }

        function showReplyForm(reviewId) {
            document.getElementById(`replySection-${reviewId}`).style.display = 'block';
        }

        function hideReplyForm(reviewId) {
            document.getElementById(`replySection-${reviewId}`).style.display = 'none';
            document.getElementById(`replyInput-${reviewId}`).value = '';
        }

        function submitReply(reviewId) {
            const replyText = document.getElementById(`replyInput-${reviewId}`).value.trim();
            if (!replyText) {
                alert('Tulis balasan terlebih dahulu!');
                return;
            }

            const allRatings = JSON.parse(localStorage.getItem('skyIslandRatings') || '[]');
            const ratingIndex = allRatings.findIndex(r => r.id === reviewId);
            
            if (ratingIndex !== -1) {
                allRatings[ratingIndex].reply = replyText;
                allRatings[ratingIndex].replyDate = new Date().toISOString();
                localStorage.setItem('skyIslandRatings', JSON.stringify(allRatings));
                
                alert('Balasan berhasil dikirim!');
                loadReviews();
            }
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleDateString('id-ID', {
                day: 'numeric',
                month: 'long',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Load reviews saat halaman dimuat
        document.addEventListener('DOMContentLoaded', function() {
            const currentUser = localStorage.getItem('skyIslandCurrentUser');
            if (!currentUser) {
                window.location.href = 'store.html';
                return;
            }
            loadReviews();
        });

        // Bottom navigation active state
        const navItems = document.querySelectorAll('.nav-item');
        
        navItems.forEach(item => {
            item.addEventListener('click', function() {
                navItems.forEach(nav => nav.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
